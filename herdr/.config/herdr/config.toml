# herdr configuration
# https://herdr.dev/docs/configuration/

onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
# Pane borders: active matches tmux #81A1C1; inactive uses the darker tmux grey.
# accent = "#81A1C1"
# overlay0 = "#4C566A"
accent = "#4C566A"
overlay0 = "#45475A"

[ui]
mouse_capture = true
right_click_passthrough_modifier = "ctrl"
prompt_new_tab_name = true
workspace_tab_label = "on" # DONE: implement (on/off/auto)
tab_number_prefix = true # DONE: implement
tab_agent_status = true # DONE: implement
pane_borders = true
pane_gaps = false
confirm_close = true
show_prefix_hint = false # DONE: implement
agent_panel_sort = "priority"
agent_panel_scope = "current"

[experimental]
pane_history = true

[keys]
# Match tmux: C-a as the prefix instead of the default C-b.
prefix = "ctrl+a"

# Session / workspace navigation.
detach = "prefix+d"
reload_config = "prefix+shift+r"
goto = ["prefix+space", "prefix+g"]
workspace_picker = ["prefix+w"]
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
navigate_workspace_up = ["up", "k", "ctrl+k"]
navigate_workspace_down = ["down", "j", "ctrl+j"]

# agent_picker = ["prefix+shift+a"] # TODO: implement

# Tabs: closest Herdr equivalent to tmux windows.
new_tab = "prefix+c"
rename_tab = "prefix+,"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"
last_tab = "prefix+ctrl+a" # DONE: implement

# Panes: mirror tmux/vim-style splits and movement.
split_horizontal = "prefix+s"
split_vertical = "prefix+v"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+a"
# last_pane = "prefix+shift+A" # original that we replace with last_pane_in_tab
# last_pane_in_tab = "prefix+a" # DONE: implement
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"

# Copy mode: tmux config uses `prefix+u` rather than the default `prefix+[`.
copy_mode = "prefix+u"

# Sidebar / help.
toggle_sidebar = "prefix+b"
help = "prefix+?"

# television pickers, mirroring the tmux `prefix+Space` / `prefix+S` bindings.
# These complement the built-in goto/workspace_picker with fuzzy search over
# every pane, tab and workspace at once. See scripts_pkg/bin/herdr-tv.
[[keys.command]]
key = "prefix+alt+p"
type = "pane"
command = "herdr-tv pick panes"

[[keys.command]]
key = "prefix+alt+t"
type = "pane"
command = "herdr-tv pick tabs"

[[keys.command]]
key = "prefix+alt+w"
type = "pane"
command = "herdr-tv pick workspaces"

[ui.toast]
delivery = "off"
delay_seconds = 1
